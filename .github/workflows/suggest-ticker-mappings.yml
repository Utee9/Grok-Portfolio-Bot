name: Suggest ticker mappings

on:
  schedule:
    - cron: '0 12 * * *'   # once daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  suggest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portfolio: [grok, claude, deepseek, gpt]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bitget Agent CLI (bgc)
        run: npm install -g @bitget-ai/bitget-agent-cli

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate mapping suggestions
        run: python scripts/generate_mapping_suggestions.py --portfolio ${{ matrix.portfolio }}

      - name: Open PR if suggestions were written
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Suggest Bitget ticker mappings for ${{ matrix.portfolio }}"
          title: "Suggested ticker mappings: ${{ matrix.portfolio }}"
          body: |
            Auto-generated by the daily ticker-mapping-suggestion job.

            Checks currently-unmapped or previously-unavailable tickers
            against Bitget's live SPOT ticker list, using the confirmed
            `r<TICKER>` prefix convention (e.g. MU -> rMU / rMUUSDT).

            **Review before merging:** this only confirms the symbol
            *exists* on Bitget, not that it's the *correct* instrument
            (right company, right share class). Cross-check in the Bitget
            app before merging.
          branch: "suggest-mappings-${{ matrix.portfolio }}"
          add-paths: "portfolios/${{ matrix.portfolio }}/config/ticker_map.json"
          delete-branch: true
