name: Suggest ticker mappings

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bitget Agent CLI (bgc)
        run: npm install -g @bitget-ai/bitget-agent-cli

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate mapping suggestions
        run: python scripts/generate_mapping_suggestions.py

      - name: Open PR if suggestions were written
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Suggest Bitget ticker mappings"
          title: "Suggested ticker mappings"
          body: |
            Auto-generated. Checks unmapped/unavailable tickers across
            ALL portfolios against Bitget's live SPOT ticker list.

            **Review before merging** -- confirms the symbol exists on
            Bitget, not that it's definitely the right company/share class.
          branch: "suggest-mappings"
          add-paths: "config/ticker_map.json"
          delete-branch: true
